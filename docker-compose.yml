services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - storage:/app/storage
    environment:
      NODE_ENV: development
      PORT: "3000"
    env_file:
      - .env

volumes:
  node_modules:
  storage:

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle:/usr/local/bundle
      - storage:/rails/storage
    environment:
      RAILS_ENV: development
      PORT: "3000"
      RUBY_DEBUG_OPEN: "true"
      RUBY_DEBUG_LAZY: "true"
    tty: true
    stdin_open: true

volumes:
  bundle:
  storage:
